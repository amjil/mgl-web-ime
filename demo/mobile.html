<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>mgl-web-ime — Mobile Demo</title>
    <link rel="stylesheet" href="../styles/ime.css" />
    <link rel="stylesheet" href="../styles/mobile.css" />
    <style>
      body {
        margin: 0;
        font-family: "Source Serif 4", Georgia, serif;
        background: linear-gradient(165deg, #e7efe6, #f2ebe3 55%, #e8e4dc);
        min-height: 100vh;
        color: #1a1a1a;
      }
      header {
        padding: 20px 20px 8px;
      }
      header h1 {
        margin: 0;
        font-size: 1.35rem;
      }
      header p {
        margin: 6px 0 0;
        opacity: 0.7;
        font-size: 0.92rem;
      }
      #editor {
        margin: 12px 16px;
        min-height: 200px;
        width: calc(100% - 32px);
        box-sizing: border-box;
      }
      .actions {
        padding: 0 16px 120px;
        display: flex;
        gap: 8px;
      }
      .actions button {
        border: 1px solid var(--mgl-ime-border);
        background: var(--mgl-ime-key-background);
        border-radius: 8px;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body class="mgl-ime-mobile-open">
    <header>
      <h1>mgl-web-ime · Mobile</h1>
      <p>Custom Mongolian virtual keyboard + candidate bar. Tap the editor to show the keyboard.</p>
    </header>

    <div
      id="editor"
      class="mgl-editor"
      contenteditable="true"
      spellcheck="false"
      inputmode="none"
    ></div>

    <div class="actions">
      <button type="button" id="btn-kb">Show / hide keyboard</button>
    </div>

    <script type="module">
      import { MglIME } from "../src/index.js";

      const ime = new MglIME({
        target: "#editor",
        profile: "mobile",
        keyboard: "virtual",
        baseUrl: "http://dev1:3003",
      });

      document.getElementById("editor").addEventListener("focus", () => {
        ime.showKeyboard();
      });

      document.getElementById("btn-kb").addEventListener("click", () => {
        if (ime.getState().keyboardVisible) ime.hideKeyboard();
        else ime.showKeyboard();
      });

      ime.showKeyboard();
    </script>
  </body>
</html>
